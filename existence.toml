# existence.toml — Existential Kernel ontology configuration

[meta]
name = "existence-lang/ontology"
description = "Reference existential ontology — 116 terms across Ring 0 kernel, Ring 1 software, and Ring 2 extended"
# RDF identity (`existence export`): term IRIs are `{base_iri}{term}` and
# dereference to the GitHub Pages term page; `xl:` metamodel properties are
# documented at vocab.md. Changing either renames every published concept.
base_iri = "https://existence-lang.github.io/ontology/"
vocab_iri = "https://existence-lang.github.io/ontology/vocab#"

[rings.0]
name = "kernel"
description = "14 universal terms, always loaded. The existential scope."
terms = [
  "existence", "entity", "abstraction", "scope", "context", "resolution",
  "pattern", "system", "domain", "focus", "perspective", "consciousness",
  "evolution", "story"
]

[rings.1]
name = "software"
description = "The DDD bridge — immediately useful for software projects."
terms = [
  "project", "model", "algorithm", "state", "type", "definition",
  "information", "signal", "language", "tool", "environment", "coherence",
  "communication", "collective", "integrity", "qualitative", "quantitative"
]

[rings.2]
name = "extended"
description = "85 terms spanning philosophy, spirituality, cognition, linguistics, and more."
terms = [
  "abstract", "abstract-system", "accuracy", "aesthetics", "agree",
  "analogy", "animism", "anthropomorphism", "art", "attention-schema", "awareness",
  "axiology", "being", "belief", "belief-system", "category-theory", "coercion",
  "compassion", "concept", "conceptual-existence", "conceptual-system", "concrescence",
  "contextual-systems", "control-system", "create", "culture", "disagree",
  "domain-driven-design", "ecosystem", "emotion", "energy", "epistemology", "ethics",
  "evolutionary-linguistics", "exist", "expanding-consciousness", "explicit-scope",
  "faith", "feeling", "fractal", "god", "heuristic", "history", "human",
  "illusion", "implicit-scope", "inertia", "intelligence", "judgement", "judicious",
  "linguistics", "love", "natural-law", "nature", "novelty", "ontology", "paradox",
  "philosophy", "physical-existence", "physical-system", "precision", "prejudice",
  "presence", "reality", "redefine", "redefinition", "religion", "respect", "science",
  "sexual-reproduction", "soul", "spirit", "spiritual-work", "spirituality",
  "technology", "this-philosophy", "tradition", "transcendence", "unconsciousness",
  "unique", "universal-set", "violence",
  "noumena", "phenomena", "pneuma"
]

# Surfaces that copy this ontology, checked by `existence audit --mirrors`.
# Optional mirrors live outside this repository and are skipped where absent.
[[mirrors]]
path = "terms.md"
kind = "toc"

[[mirrors]]
path = "../../../philosophy/src"
kind = "nodes"
optional = true

# The global instruction table is a deliberate paraphrase: each row restates
# its node in one compressed line for use in conversation, so it is checked for
# term coverage, not wording. `compare = "wording"` would report all nine
# kernel rows as drift while every one of them is accurate.
# `rings = [0]` is a completeness claim: this table is exactly the 14 Ring 0
# kernel terms, so a new kernel term that never gets a row is reported instead
# of rotting the mirror silently. `compare` only ever judges the rows present.
[[mirrors]]
path = "~/.claude/CLAUDE.md"
kind = "table"
optional = true
compare = "paraphrase"
rings = [0]

# Mentions reviewed and deliberately left unlinked. `--contradictions` finds a
# known term named in a lay definition without a link; these twelve are the
# answer "yes, and it stays that way", so recording them here stops the weekly
# report from re-asking a settled question. An entry that stops matching is
# reported as `stale_keep` — this list is a record of decisions, not a drawer.

# `nature` and `types` are ordinary English about values, not the nodes.
[[audit.keep_unlinked]]
term = "axiology"
mention = "nature"
reason = "the nature of values, ordinary English, not the Nature node"

[[audit.keep_unlinked]]
term = "axiology"
mention = "type"
reason = "kinds of value, ordinary English, not type theory"

[[audit.keep_unlinked]]
term = "ontology"
mention = "type"
reason = "the fundamental types of entity, ordinary English, not type theory"

[[audit.keep_unlinked]]
term = "domain"
mention = "unique"
reason = "\"her unique characteristics\" is the adjective, not the node"

[[audit.keep_unlinked]]
term = "type"
mention = "science"
reason = "\"mathematics, logic, and computer science\" names a field in a borrowed sentence"

[[audit.keep_unlinked]]
term = "consciousness"
mention = "being"
reason = "\"the ability of being present\" is a gerund, not the noun Being"

[[audit.keep_unlinked]]
term = "unique"
mention = "being"
reason = "\"Being the only one of its kind\" is a participle, not the noun Being"

[[audit.keep_unlinked]]
term = "belief-system"
mention = "system"
reason = "occurs only inside this node's own name, Belief System"

[[audit.keep_unlinked]]
term = "evolutionary-linguistics"
mention = "linguistics"
reason = "occurs only inside this node's own name, Evolutionary Linguistics"

[[audit.keep_unlinked]]
term = "physical-system"
mention = "system"
reason = "\"outside the system\" refers back to this node itself"

[[audit.keep_unlinked]]
term = "epistemology"
mention = "concept"
reason = "inside the quoted Plato example, not the definition's own prose"

# Settled by #xlgenuscycles, which resolved the other four pairs and left this
# one: being.md is "To be, to exist", so the link would recreate the cycle.
[[audit.keep_unlinked]]
term = "exist"
mention = "being"
reason = "linking it would recreate a mutual-definition cycle with being"
